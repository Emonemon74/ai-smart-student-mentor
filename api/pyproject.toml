description = "AI Smart Student Mentor: API"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]",
  "psycopg[binary,pool]",
  "openai",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
